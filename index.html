<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Adinchoo Dreeve - Fitness AI Hub</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<div id="app">
<nav class="bottom-nav">
  <button data-view="dashboardView" class="active">🏠<span>Home</span></button>
  <button data-view="foodView">🍽️<span>Meals</span></button>
  <button data-view="workoutView">💪<span>Work</span></button>
  <button data-view="gpxReportView">🗺️<span>GPX</span></button>
  <button data-view="profileView">👤<span>Profile</span></button>
</nav>

<section id="dashboardView" class="view active">
  <h2>Dreeve Dashboard</h2>
  <div class="card"><h3>Weight Trend</h3><div class="chart-wrap"><canvas id="weightChart"></canvas></div></div>
  <div class="card"><h3>Calories</h3><div class="chart-wrap small"><canvas id="caloriesChart"></canvas></div></div>
  <div class="card"><h3>Steps</h3><div class="chart-wrap small"><canvas id="stepsChart"></canvas></div></div>
  <div class="card"><h3>Monthly</h3><div class="chart-wrap"><canvas id="monthlyChart"></canvas></div></div>
  <div class="card"><h3>Recent Activities</h3><div id="recentActivities"></div></div>
  <div class="card"><h3>Today</h3><div id="todaySummary" class="muted">No data yet</div><div id="checkinText" class="muted" style="margin-top:10px"></div></div>
</section>

<section id="foodView" class="view"><h2>Meals</h2><div id="foodList" class="card"></div></section>
<section id="workoutView" class="view"><h2>Workouts</h2><div id="workoutList" class="card"></div></section>

<section id="gpxReportView" class="view">
  <h2>GPX / FIT Report</h2>
  <div class="card" id="gpxDropZone" style="border:2px dashed #333;text-align:center;padding:24px;border-radius:16px">
    <div style="font-size:42px">🗺️</div>
    <h3>Drop FIT or GPX here</h3>
    <p class="muted">iPhone: Tap button below to open Files app</p>
    <label for="gpxReportFile" class="btn primary" style="display:inline-flex;cursor:pointer;padding:12px 22px;border-radius:12px;background:#c6ff00;color:#000;font-weight:800;font-size:15px">📁 Open FIT / GPX file</label>
    <p class="muted" style="margin-top:12px">Or tap any activity below for full report with map</p>
  </div>
  <input type="file" id="gpxReportFile" accept=".gpx,.fit,application/gpx+xml" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0"/>
  <div id="gpxReportContent"></div>
  <div class="card"><h3>All Activities (150 latest)</h3><div style="display:flex;gap:8px;margin-bottom:12px"><input id="activityDateFilter" type="month"/><input id="activitySearchFilter" placeholder="Search run, bike..."/></div><div id="activitiesTable"></div></div>
</section>

<section id="profileView" class="view"><h2>Profile</h2><div id="profileContent" class="card"></div><button class="btn primary" onclick="AI.testPuter().then(r=>alert(r)).catch(e=>alert(e.message))">Test Puter AI</button></section>
</div>
<div id="toast"></div>
<script src="foods.js"></script>
<script src="health.js"></script>
<script src="integrations.js"></script>
<script src="ai.js"></script>
<script src="gpx-report.js"></script>
<script src="app.js"></script>
</body>
</html>
